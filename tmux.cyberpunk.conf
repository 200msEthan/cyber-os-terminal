# ============================================================================
# CYBERPUNK NEON // TMUX MULTIPLEXER CONFIGURATION
# ============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g status-interval 2
set -g status-position bottom

# Neon Pane Borders
set -g pane-border-style "fg=#2a244d"
set -g pane-active-border-style "fg=#00f3ff"

# Status Bar Style
set -g status-style "bg=#0d091f,fg=#00f3ff"
set -g status-left-length 50
set -g status-right-length 100

set -g status-left "#[fg=#0d091f,bg=#ff00a0,bold] ⚡ CYBER-DECK #[fg=#ff00a0,bg=#181236]#[fg=#00f3ff,bg=#181236,bold] #S #[fg=#181236,bg=#0d091f] "
set -g status-right "#[fg=#181236,bg=#0d091f]#[fg=#00ff9f,bg=#181236] ◈ #(awk '{print $1}' /proc/loadavg) #[fg=#ff00a0,bg=#181236]#[fg=#0d091f,bg=#ff00a0,bold] ⌚ %H:%M:%S "

setw -g window-status-format "#[fg=#6e7891,bg=#0d091f]  #I:#W  "
setw -g window-status-current-format "#[fg=#0d091f,bg=#00f3ff,bold] #I:#W #[fg=#00f3ff,bg=#0d091f]"
