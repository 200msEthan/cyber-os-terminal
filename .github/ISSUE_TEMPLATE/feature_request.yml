name: ✨ Feature or new module
description: Suggest a new tool, platform support, theme, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: How could it work?
      description: Command name, flags, sample output, which file it belongs in. Remember the core rule — standard library only.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to build this myself
