# ============================================================================
# CYBERPUNK NEON // STARSHIP PROMPT CONFIGURATION
# Palette: Electric Cyan (#00f3ff), Neon Magenta (#ff00a0), Deep Void (#120b29)
# ============================================================================

format = """
[╔═\\[](#ff00a0)\
$os\
$username\
$hostname\
[\\]═\\[](#ff00a0)\
$directory\
[\\]](fg:#ff00a0)\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$cmd_duration\
$fill\
[\\[](#5a64ff)$time[\\]](fg:#5a64ff)\
$line_break\
[╚═](#ff00a0)$character"""

add_newline = true
command_timeout = 1000

[os]
disabled = false
style = "bold #00f3ff"

[os.symbols]
Ubuntu = "⚡ "
Linux = "⚡ "
Macos = "❖ "
Windows = "◢ "

[username]
show_always = true
style_user = "bold #00f3ff"
style_root = "bold #ff2a6d"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold #bd00ff"
format = "[@$hostname]($style)"

[directory]
style = "bold #fcee0a"
format = "[ ◈ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 🔒"
read_only_style = "bold #ff2a6d"

[git_branch]
symbol = " "
style = "bold #00ff9f"
format = "[═\\[ $symbol$branch ]($style)"

[git_status]
style = "bold #ff00a0"
format = "([$all_status$ahead_behind]($style))[\\]](fg:#00ff9f)"
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[python]
symbol = "🐍 "
style = "bold #00f3ff"
format = '[═\[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )\]]($style)'

[nodejs]
symbol = "⬢ "
style = "bold #00ff9f"
format = '[═\[ $symbol($version) \]]($style)'

[rust]
symbol = "⚙ "
style = "bold #ff2a6d"
format = '[═\[ $symbol($version) \]]($style)'

[golang]
symbol = "◈ "
style = "bold #00f3ff"
format = '[═\[ $symbol($version) \]]($style)'

[docker_context]
symbol = "🐳 "
style = "bold #5a64ff"
format = '[═\[ $symbol$context \]]($style)'

[cmd_duration]
min_time = 500
style = "bold #fcee0a"
format = '[═\[ ⏱ $duration \]]($style)'

[fill]
symbol = "─"
style = "bold #2a244d"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bold #00f3ff"
format = "[ ⌚ $time ]($style)"

[character]
success_symbol = "[◢◤](bold #00f3ff) [❯](bold #ff00a0)"
error_symbol = "[◢◤](bold #ff2a6d) [❯](bold #ff2a6d)"
vimcmd_symbol = "[❮](bold #00ff9f)"
